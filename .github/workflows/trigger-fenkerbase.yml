name: Trigger fenkerBase deploy

# Pushes to main send a `repository_dispatch` (type `submodule-push`) to j3fnkr/fenkerBase.
# Its self-hosted runner then rebuilds and redeploys this submodule's service at the latest
# main and bumps the pinned submodule pointer in fenkerBase (see fenkerBase's
# .github/workflows/deploy.yml). Requires the FENKERBASE_DISPATCH_PAT secret: a fine-grained
# PAT with Contents: read+write on j3fnkr/fenkerBase only.

on:
  push:
    branches: [main]

jobs:
  dispatch:
    name: Notify fenkerBase runner
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.FENKERBASE_DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/j3fnkr/fenkerBase/dispatches \
            -d '{"event_type":"submodule-push","client_payload":{"submodule":"repos/my_flask_webpage"}}'
